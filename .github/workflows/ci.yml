name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.26.x"
  GOLANGCI_LINT_VERSION: v2.11.4

jobs:
  modules:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [., examples, http, jwt, logger, monetary, osrelease, postgres, supabase]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test ./... -race -count=1

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module }}
          args: --config ${{ github.workspace }}/.golangci.yml ./...

      - name: format check
        run: golangci-lint fmt --config ${{ github.workspace }}/.golangci.yml --diff ./...

  integration:
    name: integration (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gox
          POSTGRES_PASSWORD: gox
          POSTGRES_DB: gox_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gox:gox@localhost:5432/gox_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      - name: go test -tags integration
        run: make test-integration

  check-deps:
    name: import-as-opt-in
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      - name: root-only import links no feature dependency
        run: make check-deps
